<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bibliothèque de decks Magic Asphodel" />
    <title>Asphodel</title>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <header class="app-header">
          <button id="home-button" class="brand-button" type="button">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span>Asphodel</span>
          </button>
          <div class="header-actions">
            <span
              id="backend-status"
              class="backend-state"
              data-status="offline"
              role="status"
              aria-live="polite"
            >Offline</span>
            <button class="primary-button" type="button" data-open-import>
              Importer un deck
            </button>
          </div>
        </header>

        <main class="app-main">
          <div class="content-area">
            <section id="library-view" aria-labelledby="library-title">
              <div class="page-heading">
                <div>
                  <p class="eyebrow">Deck Library</p>
                  <h1 id="library-title">Mes decks</h1>
                  <p class="page-description">
                    Importez et retrouvez vos listes Commander enrichies par Scryfall.
                  </p>
                </div>
                <button class="primary-button" type="button" data-open-import>
                  Nouveau deck
                </button>
              </div>

              <p id="library-feedback" class="page-feedback" hidden></p>
              <div id="deck-library" class="deck-library" aria-live="polite"></div>
            </section>

            <section id="detail-view" class="detail-view" aria-live="polite" hidden>
              <button id="back-to-library" class="back-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M15 18l-6-6 6-6" />
                </svg>
                Bibliothèque
              </button>
              <div id="deck-detail"></div>
            </section>
          </div>
        </main>
      </div>

      <dialog id="deck-modal" class="deck-modal" aria-labelledby="deck-modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Nouveau deck</p>
            <h2 id="deck-modal-title" class="modal-title">Importer un deck</h2>
          </div>
          <button
            id="close-deck-modal"
            class="icon-button"
            type="button"
            aria-label="Fermer la fenêtre"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <form id="deck-form">
          <div class="modal-content">
            <label class="field-label" for="deck-name">Nom du deck</label>
            <input
              id="deck-name"
              class="text-input"
              name="name"
              type="text"
              maxlength="120"
              placeholder="Gobelins de Krenko"
              required
            />

            <label class="field-label field-label--spaced" for="deck-input">
              Liste du deck
            </label>
            <p id="deck-input-help" class="field-help">
              Utilisez les sections Commander et Mainboard, puis une carte par ligne.
            </p>
            <textarea
              id="deck-input"
              class="deck-input"
              name="decklist"
              rows="14"
              placeholder="Commander&#10;1x Krenko, Tin Street Kingpin&#10;&#10;Mainboard&#10;1x Sol Ring&#10;30x Mountain"
              aria-describedby="deck-input-help"
              required
            ></textarea>

            <section
              id="import-feedback"
              class="import-feedback"
              aria-live="polite"
              hidden
            ></section>
          </div>

          <div class="modal-footer">
            <button id="cancel-deck-modal" class="secondary-button" type="button">
              Annuler
            </button>
            <button id="save-deck" class="primary-button" type="submit">
              Importer et enregistrer
            </button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
