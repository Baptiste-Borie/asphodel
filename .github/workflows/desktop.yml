name: Asphodel Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'forge-bridge/**'
      - 'vendor/forge'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'forge-bridge/**'
      - 'vendor/forge'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - run: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix desktop ci
      - run: npm --prefix desktop run check:package -- --version-only
      - run: ./scripts/forge-build.sh
      - run: npm --prefix backend test && npm --prefix backend run build && npm --prefix frontend test && npm --prefix desktop test
      - run: npm --prefix desktop run build
      - run: xvfb-run -a npm --prefix desktop run smoke:art-headers
      - run: xvfb-run -a npm --prefix desktop run smoke:window
      - run: npm --prefix desktop run smoke:runtime
      - run: xvfb-run -a npm --prefix desktop run smoke
      - working-directory: desktop
        run: npm exec -- electron-builder --linux AppImage deb --publish never
      - run: npm --prefix desktop run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: Asphodel-Desktop-Linux-${{ github.sha }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
